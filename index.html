<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos</title>
<style>
:root{--bg:#ebebeb;--card:#fff;--tx:#222;--mut:#666;--bl:#3483fa;--ye:#ffe600;--ln:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e1e;--tx:#eee;--mut:#aaa;--ln:#333}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--tx:#eee;--mut:#aaa;--ln:#333}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--ye);padding:10px 12px;z-index:5}
header input{width:100%;border:0;border-radius:22px;padding:11px 16px;font-size:16px;background:#fff;color:#222}
main{padding:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer}
.ph{position:relative;height:150px;display:flex;align-items:center;justify-content:center;font-size:56px;background:#f0f0f0;overflow:hidden}
.ph img,.big img,.th img{width:100%;height:100%;object-fit:cover}
.add{position:absolute;right:8px;bottom:8px;min-width:38px;height:38px;padding:0 10px;border-radius:19px;border:0;background:#fff;color:var(--bl);font-size:16px;box-shadow:0 1px 4px #0003}
.add.on{background:var(--bl);color:#fff;font-weight:700}
.nm{padding:10px;font-size:14px;line-height:1.3}
h2{font-size:18px;margin:6px 2px 12px}
.chip{display:block;width:100%;background:var(--card);border:0;border-radius:10px;padding:16px;margin-bottom:8px;text-align:left;font-size:16px;color:var(--tx)}
.chip.on{outline:2px solid var(--bl)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:12px;color:var(--mut);position:relative}
nav button b{display:block;font-size:22px;font-weight:400}
nav button.on{color:var(--bl)}
.bd{position:absolute;top:2px;left:55%;background:var(--bl);color:#fff;border-radius:10px;min-width:19px;font-size:11px;padding:2px 5px}
.up{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:0;background:#dbe8fd;color:var(--bl);font-size:20px;display:none;z-index:4}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.bk,.lnk{background:none;border:0;font-size:16px;color:var(--bl);padding:14px}
.big{height:300px;display:flex;align-items:center;justify-content:center;font-size:120px;background:#f0f0f0;overflow:hidden}
.box{background:var(--card);padding:16px;margin:10px;border-radius:10px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.q{display:flex;align-items:center;gap:12px;font-size:18px}
.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bl);background:none;color:var(--bl);font-size:18px}
.btn{width:100%;border:0;background:var(--bl);color:#fff;border-radius:8px;padding:14px;font-size:16px;font-weight:600;margin-top:12px}
.btn.g{background:#2a9d4b}.btn.r{background:#d33}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px}
.th{width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;background:#f0f0f0;overflow:hidden}
.item .nm{padding:0;flex:1}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.f{width:100%;padding:12px;border:1px solid var(--ln);border-radius:8px;font-size:16px;background:var(--card);color:var(--tx)}
.err{color:#d33;font-size:13px;min-height:16px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:20;display:none}
.mut{color:var(--mut)}
.atop{display:flex;justify-content:space-between;align-items:center;background:var(--ye);color:#222;padding:8px 14px;margin:-10px -10px 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:11px;border:0;border-radius:8px;background:var(--card);color:var(--tx);font-size:15px}
.tabs button.on{background:var(--bl);color:#fff}
.sm{font-size:13px;color:var(--mut);margin:2px 0}
.ord{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px}
.ord ul{margin:6px 0;padding-left:18px;font-size:14px}
</style></head><body>
<header id="hd"><input id="s" placeholder="Buscar productos" autocomplete="off"></header>
<main id="app"></main>
<button class="up" id="up">↑</button>
<div class="toast" id="t"></div>
<nav id="nv">
<button data-v="home"><b>⌂</b>Inicio</button>
<button data-v="cats"><b>▦</b>Categorías</button>
<button data-v="cart"><b>🛒</b>Carrito<span class="bd" id="bd" style="display:none"></span></button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getFirestore,collection,onSnapshot,addDoc,setDoc,doc,deleteDoc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyDo36T74A2kSIcTV5k1zRvalHKjvAB2kOg",authDomain:"pedidos-dfr.firebaseapp.com",projectId:"pedidos-dfr",storageBucket:"pedidos-dfr.firebasestorage.app",messagingSenderId:"611337061893",appId:"1:611337061893:web:83720a03b60e6a48e0fe6c"});
const db=getFirestore(app),auth=getAuth(app);
const $=s=>document.querySelector(s),ADMIN=location.hash=='#admin';
addEventListener('hashchange',()=>location.reload());
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pic=(p,big)=>p.img?`<img src="${p.img}" alt="">`:'📦';
let P=[],C=[],O=[];
/* ================= CLIENTE ================= */
let cart={},cat='Todas',q='',view='home';
const pr=id=>P.find(p=>p.id==id),total=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));
 const bd=$('#bd');bd.style.display=total()?'block':'none';bd.textContent=total();
 const a=$('#app'),cats=['Todas',...new Set(P.map(p=>p.c).filter(Boolean))];
 if(view=='home'){
  const l=P.filter(p=>(cat=='Todas'||p.c==cat)&&p.n.toLowerCase().includes(q.toLowerCase()));
  a.innerHTML=(cat!='Todas'?'<h2>'+esc(cat)+'</h2>':'')+(l.length?'<div class="grid">'+l.map(p=>`<div class="card" data-id="${p.id}"><div class="ph">${pic(p)}<button class="add ${cart[p.id]?'on':''}">🛒${cart[p.id]?' '+cart[p.id]:'+'}</button></div><div class="nm">${esc(p.n)}</div></div>`).join('')+'</div>':'<p class="mut">No hay productos para mostrar.</p>');
 }else if(view=='cats'){
  a.innerHTML='<h2>Categorías</h2>'+cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
 }else{
  const ids=Object.keys(cart).filter(pr);
  a.innerHTML='<h2>Mi carrito</h2>'+(ids.length?ids.map(id=>{const p=pr(id);return `<div class="item"><div class="th">${pic(p)}</div><div class="nm">${esc(p.n)}</div><div class="q"><button data-m="${id}">–</button>${cart[id]}<button data-p="${id}">+</button></div></div>`}).join('')+'<button class="btn" id="send">Enviar</button>':'<p class="mut">Todavía no agregaste productos.</p>');
 }
}
function detail(id){
 const p=pr(id);let n=cart[id]||1;
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<button class="bk">← Volver</button><div class="big">${pic(p)}</div><div class="box"><div style="font-size:18px;font-weight:600">${esc(p.n)}</div><p class="mut">${esc(p.d)}</p><div class="row"><span>Cantidad</span><div class="q"><button id="mn">–</button><span id="nn">${n}</span><button id="pl">+</button></div></div><button class="btn" id="ad">${cart[id]?'Actualizar cantidad':'Agregar al carrito'}</button></div>`;
 document.body.appendChild(o);
 o.querySelector('.bk').onclick=()=>o.remove();
 o.querySelector('#mn').onclick=()=>{n=Math.max(1,n-1);o.querySelector('#nn').textContent=n};
 o.querySelector('#pl').onclick=()=>{n++;o.querySelector('#nn').textContent=n};
 o.querySelector('#ad').onclick=()=>{cart[id]=n;o.remove();render();toast('Carrito actualizado')};
}
function form(){
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<button class="bk">← Volver</button><div class="box"><div style="font-size:18px;font-weight:600">Tus datos</div><label>Nombre</label><input class="f" id="fn"><label>Apellido</label><input class="f" id="fa"><label>Localidad</label><input class="f" id="fl"><label>Número de cliente *</label><input class="f" id="fc" inputmode="numeric"><div class="err" id="er"></div><button class="btn" id="ok">Enviar pedido</button></div>`;
 document.body.appendChild(o);
 o.querySelector('.bk').onclick=()=>o.remove();
 o.querySelector('#ok').onclick=async()=>{
  const v=['fn','fa','fl','fc'].map(i=>o.querySelector('#'+i).value.trim());
  if(v.some(x=>!x)){o.querySelector('#er').textContent='Completá todos los campos. El número de cliente es obligatorio.';return}
  const items=Object.keys(cart).filter(pr).map(id=>({cod:pr(id).cod||'',n:pr(id).n,q:cart[id]}));
  o.querySelector('#ok').disabled=true;
  try{await addDoc(collection(db,'orders'),{nombre:v[0],apellido:v[1],loc:v[2],num:v[3],items,estado:'Nuevo',ts:serverTimestamp()})}
  catch(e){o.querySelector('#ok').disabled=false;o.querySelector('#er').textContent='No se pudo enviar. Revisá tu conexión e intentá de nuevo.';return}
  cart={};
  o.innerHTML='<div class="box" style="margin-top:60px;text-align:center"><div style="font-size:60px">✅</div><div style="font-size:20px;font-weight:600">¡Pedido enviado!</div><p class="mut" id="gr"></p><button class="btn" id="fin">Volver al inicio</button></div>';
  o.querySelector('#gr').textContent='Gracias '+v[0]+', recibimos tu pedido.';
  o.querySelector('#fin').onclick=()=>{o.remove();view='home';render();scrollTo(0,0)};
 };
}
function startClient(){
 onSnapshot(collection(db,'products'),s=>{P=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.n.localeCompare(b.n));render()});
 $('#app').onclick=e=>{
  const t=e.target,c=t.closest('.card');if(c){detail(c.dataset.id);return}
  const ct=t.closest('[data-cat]');if(ct){cat=ct.dataset.cat;view='home';render();scrollTo(0,0);return}
  if(t.dataset.p){cart[t.dataset.p]++;render()}
  else if(t.dataset.m){if(--cart[t.dataset.m]<=0)delete cart[t.dataset.m];render()}
  else if(t.id=='send')form();
 };
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();scrollTo(0,0)});
 $('#s').oninput=e=>{q=e.target.value;view='home';render()};
 $('#up').onclick=()=>scrollTo({top:0,behavior:'smooth'});
 addEventListener('scroll',()=>$('#up').style.display=scrollY>400?'block':'none');
 render();
}
/* ================= ADMINISTRADOR ================= */
let tab='p',edit=null,sel=new Set(),unsub=[];
const rs=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});
const nomCli=n=>(C.find(c=>c.id==n)||{}).nombre;
function login(){
 $('#app').innerHTML=`<div class="box" style="margin-top:40px"><div style="font-size:18px;font-weight:600">Administrador</div><label>Correo</label><input class="f" id="em" type="email"><label>Contraseña</label><input class="f" id="pw" type="password"><div class="err" id="er"></div><button class="btn" id="go">Ingresar</button></div>`;
 $('#go').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(e){$('#er').textContent='Correo o contraseña incorrectos.'}};
}
function shell(){
 $('#app').innerHTML=`<div class="atop"><b>Administrador</b><button class="lnk" id="lo">Salir</button></div><div class="tabs">${[['p','Productos'],['c','Clientes'],['o','Pedidos']].map(([k,l])=>`<button data-t="${k}" class="${k==tab?'on':''}">${l}</button>`).join('')}</div><div id="frm"></div><div id="lst"></div>`;
 $('#lo').onclick=()=>signOut(auth);
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;edit=null;shell()});
 frm();list();
}
function frm(){
 const f=$('#frm');
 if(tab=='p'){
  const p=P.find(x=>x.id==edit)||{};
  f.innerHTML=`<div class="box"><b>${edit?'Editar producto':'Nuevo producto'}</b><label>Foto</label><input type="file" id="fo" accept="image/*"><label>Código</label><input class="f" id="pc" value="${esc(p.cod)}"><label>Descripción</label><input class="f" id="pn" value="${esc(p.n)}"><label>Categoría</label><input class="f" id="pg" value="${esc(p.c)}"><label>Detalle (opcional)</label><input class="f" id="pd" value="${esc(p.d)}"><div class="err" id="er"></div><button class="btn" id="sv">Guardar</button>${edit?'<button class="lnk" id="cx">Cancelar</button>':''}</div>`;
  if(edit)$('#cx').onclick=()=>{edit=null;frm()};
  $('#sv').onclick=async()=>{
   const d={cod:$('#pc').value.trim(),n:$('#pn').value.trim(),c:$('#pg').value.trim(),d:$('#pd').value.trim()};
   if(!d.cod||!d.n){$('#er').textContent='Código y descripción son obligatorios.';return}
   $('#sv').disabled=true;
   try{const fl=$('#fo').files[0];if(fl)d.img=await rs(fl);
    await setDoc(edit?doc(db,'products',edit):doc(collection(db,'products')),d,{merge:true});edit=null;frm();toast('Producto guardado')}
   catch(e){$('#sv').disabled=false;$('#er').textContent='No se pudo guardar.'}
  };
 }else if(tab=='c'){
  const c=C.find(x=>x.id==edit)||{};
  f.innerHTML=`<div class="box"><b>${edit?'Editar cliente':'Nuevo cliente'}</b><label>Número de cliente</label><input class="f" id="cn" value="${esc(c.id)}" ${edit?'disabled':''}><label>Nombre</label><input class="f" id="cm" value="${esc(c.nombre)}"><label>Dirección de entrega</label><input class="f" id="cd" value="${esc(c.dir)}"><div class="err" id="er"></div><button class="btn" id="sv">Guardar</button>${edit?'<button class="lnk" id="cx">Cancelar</button>':''}</div>`;
  if(edit)$('#cx').onclick=()=>{edit=null;frm()};
  $('#sv').onclick=async()=>{
   const n=$('#cn').value.trim().replace(/\//g,''),nm=$('#cm').value.trim();
   if(!n||!nm){$('#er').textContent='Número y nombre son obligatorios.';return}
   try{await setDoc(doc(db,'clients',n),{nombre:nm,dir:$('#cd').value.trim()});edit=null;frm();toast('Cliente guardado')}catch(e){$('#er').textContent='No se pudo guardar.'}
  };
 }else f.innerHTML='';
}
function list(){
 const l=$('#lst');if(!l)return;
 if(tab=='p'){
  l.innerHTML=P.map(p=>`<div class="item"><div class="th">${pic(p)}</div><div class="nm"><b>${esc(p.cod)}</b> · ${esc(p.n)}<div class="sm">${esc(p.c)}</div></div><button class="lnk" data-e="${p.id}">Editar</button><button class="lnk" style="color:#d33" data-x="${p.id}">✕</button></div>`).join('')||'<p class="mut">Todavía no cargaste productos.</p>';
 }else if(tab=='c'){
  l.innerHTML=C.map(c=>`<div class="item"><div class="nm"><b>${esc(c.id)}</b> · ${esc(c.nombre)}<div class="sm">${esc(c.dir)}</div></div><button class="lnk" data-e="${c.id}">Editar</button><button class="lnk" style="color:#d33" data-x="${c.id}">✕</button></div>`).join('')||'<p class="mut">Todavía no cargaste clientes.</p>';
 }else{
  l.innerHTML=(O.length?`<button class="btn g" id="xl">Exportar a Excel (${sel.size})</button><button class="lnk" id="sa">Tildar todos / ninguno</button>`:'<p class="mut">Todavía no hay pedidos.</p>')+O.map(o=>{const c=C.find(x=>x.id==o.num);return `<div class="ord"><div class="row"><label style="margin:0;display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px"><input type="checkbox" data-s="${o.id}" ${sel.has(o.id)?'checked':''}><b>${esc(o.num)}</b> · ${esc(c?c.nombre:'Cliente no registrado')}</label><select data-st="${o.id}">${['Nuevo','Preparando','Enviado','Entregado'].map(s=>`<option ${s==o.estado?'selected':''}>${s}</option>`).join('')}</select></div><div class="sm">${esc(o.nombre)} ${esc(o.apellido)} · ${esc(o.loc)}${c&&c.dir?' · '+esc(c.dir):''}</div><div class="sm">${o.ts?o.ts.toDate().toLocaleString('es-AR'):''}</div><ul>${o.items.map(i=>`<li>${esc(i.q)} × ${esc(i.n)} (${esc(i.cod)})</li>`).join('')}</ul></div>`}).join('');
 }
}
function exportar(){
 const sl=O.filter(o=>sel.has(o.id));if(!sl.length){toast('Tildá al menos un pedido');return}
 const by={};sl.forEach(o=>(by[o.num]=by[o.num]||[]).push(o));
 const rows=[];Object.keys(by).forEach((n,i)=>{if(i)rows.push([]);const nm=nomCli(n)||'';by[n].forEach(o=>o.items.forEach(it=>rows.push([n,nm,it.n,it.cod,it.q])))});
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Pedidos');XLSX.writeFile(wb,'pedidos.xlsx');
}
function startAdmin(){
 $('#hd').style.display='none';$('#nv').style.display='none';
 $('#app').onclick=async e=>{
  const t=e.target;
  if(t.dataset.e){edit=t.dataset.e;frm();scrollTo(0,0)}
  else if(t.dataset.x&&confirm('¿Eliminar?')){await deleteDoc(doc(db,tab=='p'?'products':'clients',t.dataset.x))}
  else if(t.dataset.s){t.checked?sel.add(t.dataset.s):sel.delete(t.dataset.s);list()}
  else if(t.id=='sa'){sel.size==O.length?sel.clear():O.forEach(o=>sel.add(o.id));list()}
  else if(t.id=='xl')exportar();
 };
 $('#app').onchange=async e=>{const t=e.target;if(t.dataset.st)await updateDoc(doc(db,'orders',t.dataset.st),{estado:t.value})};
 onAuthStateChanged(auth,u=>{
  unsub.forEach(f=>f());unsub=[];
  if(!u){login();return}
  shell();
  unsub.push(onSnapshot(collection(db,'products'),s=>{P=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.n.localeCompare(b.n));list()}));
  unsub.push(onSnapshot(collection(db,'clients'),s=>{C=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));list()}));
  unsub.push(onSnapshot(collection(db,'orders'),s=>{O=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts?b.ts.seconds:9e9)-(a.ts?a.ts.seconds:9e9));list()}));
 });
}
ADMIN?startAdmin():startClient();
</script></body></html>
