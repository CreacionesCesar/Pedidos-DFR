<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<style>
:root{--bg:#ebebeb;--card:#fff;--tx:#222;--mut:#666;--bl:#3483fa;--ye:#de010c;--ln:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1e1e1e;--tx:#eee;--mut:#aaa;--ln:#333}}
:root[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--tx:#eee;--mut:#aaa;--ln:#333}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--ye);padding:10px 12px;z-index:5}
header input{display:block;width:100%;max-width:700px;margin:0 auto;border:0;border-radius:22px;padding:11px 16px;font-size:16px;background:#fff;color:#222}
main{padding:10px;max-width:1100px;margin:0 auto}main.nr{max-width:700px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer}
.ph{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:56px;background:#fff;overflow:hidden}
.ph img,.big img,.th img{width:100%;height:100%;object-fit:contain}
.add{flex:none;min-width:46px;height:42px;padding:0 12px;border-radius:21px;border:0;background:#de010c;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 2px 6px #de010c55}.add svg{width:22px;height:22px}
.cap{display:flex;align-items:center;gap:6px;padding:6px 8px 10px 10px}.cap .nm{padding:0;flex:1}
.add.on{background:#2a9d4b;box-shadow:0 2px 6px #2a9d4b55}
.noimg img{display:none}.noimg::after{content:'Sin foto';color:#999;font-size:14px}
.nm{padding:10px;font-size:14px;line-height:1.3}
h2{font-size:18px;margin:6px 2px 12px}
.chip{display:block;width:100%;background:var(--card);border:0;border-radius:10px;padding:16px;margin-bottom:8px;text-align:left;font-size:16px;color:var(--tx)}
.chip.on{outline:2px solid var(--bl)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;max-width:220px;background:none;border:0;padding:9px 0 8px;font-size:12px;color:var(--mut);position:relative}
nav button b{display:block;font-weight:400}nav button b svg{display:block;margin:0 auto 2px}button svg{pointer-events:none}
nav button.on{color:#de010c}
.bd{position:absolute;top:2px;left:55%;background:#de010c;color:#fff;border-radius:10px;min-width:19px;font-size:11px;padding:2px 5px}
.up{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:0;background:#dbe8fd;color:var(--bl);font-size:20px;display:none;z-index:4}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;align-items:center}
.ov>*{align-self:center}.ov>.bk{width:min(100%,560px);text-align:left}.ov>.big{width:min(100%,560px)}.ov>.box{width:min(calc(100% - 20px),540px)}
.bk,.lnk{background:none;border:0;font-size:16px;color:var(--bl);padding:14px}
.big{height:300px;display:flex;align-items:center;justify-content:center;font-size:120px;background:#fff;overflow:hidden}
.box{background:var(--card);padding:16px;margin:10px;border-radius:10px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.q{display:flex;align-items:center;gap:12px;font-size:18px}
.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bl);background:none;color:var(--bl);font-size:18px}
.btn{width:100%;border:0;background:var(--bl);color:#fff;border-radius:8px;padding:14px;font-size:16px;font-weight:600;margin-top:12px}
.btn.g{background:#2a9d4b}.btn.r{background:#d33}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px}
.th{width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;background:#fff;overflow:hidden}
.item .nm{padding:0;flex:1}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.f{width:100%;padding:12px;border:1px solid var(--ln);border-radius:8px;font-size:16px;background:var(--card);color:var(--tx)}
.err{color:#d33;font-size:13px;min-height:16px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:20;display:none}
.mut{color:var(--mut)}
.qi{width:70px;text-align:center;font-size:18px;border:1px solid var(--ln);border-radius:8px;padding:6px 2px;background:var(--card);color:var(--tx);-moz-appearance:textfield}.qi::-webkit-outer-spin-button,.qi::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pw{position:relative}.pw .f{padding-right:50px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:20px;padding:8px;color:var(--tx)}
.atop{display:flex;justify-content:space-between;align-items:center;background:var(--ye);color:#fff;padding:8px 14px;margin:-10px -10px 10px}
.atop .lnk{color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:11px;border:0;border-radius:8px;background:var(--card);color:var(--tx);font-size:15px}
.tabs button.on{background:var(--bl);color:#fff}
.sm{font-size:13px;color:var(--mut);margin:2px 0}
.ord{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px}
.ord ul{margin:6px 0;padding-left:18px;font-size:14px}
</style></head><body>
<header id="hd"><input id="s" placeholder="Buscar productos" autocomplete="off"></header>
<main id="app"></main>
<footer id="ft" style="text-align:center;padding:4px 0 20px"><a href="#admin" style="font-size:13px;color:var(--mut);text-decoration:none">Acceso administrador</a></footer>
<button class="up" id="up">↑</button>
<div class="toast" id="t"></div>
<nav id="nv">
<button data-v="home"><b><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h4.5v-6h4v6h4.5V10"/></svg></b>Inicio</button>
<button data-v="cats"><b><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></b>Categorías</button>
<button data-v="cart"><b><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.7"/><circle cx="18" cy="20" r="1.7"/><path d="M2 3.5h3l2.6 12a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 7.5H6"/></svg></b>Carrito<span class="bd" id="bd" style="display:none"></span></button>
<button data-v="ped"><b><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></b>Historial</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="module">

import {getMessaging,getToken} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";
const cfg={apiKey:"AIzaSyDo36T74A2kSIcTV5k1zRvalHKjvAB2kOg",authDomain:"pedidos-dfr.firebaseapp.com",projectId:"pedidos-dfr",storageBucket:"pedidos-dfr.firebasestorage.app",messagingSenderId:"611337061893",appId:"1:611337061893:web:83720a03b60e6a48e0fe6c"};const app=initializeApp(cfg);
const db=getFirestore(app),auth=getAuth(app),secAuth=getAuth(initializeApp(cfg,'sec'));
const pwf=(id,ac)=>`<div class="pw"><input class="f" id="${id}" type="password" autocomplete="${ac}"><button type="button" class="eye" data-eye="${id}" aria-label="Mostrar contraseña">👁</button></div>`;
addEventListener('click',e=>{const b=e.target.closest('[data-eye]');if(b){const i=document.getElementById(b.dataset.eye);i.type=i.type=='password'?'text':'password';b.textContent=i.type=='password'?'👁':'🙈'}});
const DOM='@clientes.pedidos-dfr.app',isCust=u=>!!(u&&u.email&&u.email.endsWith(DOM));
const VAPID='BAxLGIBDv2KsvCErE4tD5vddmnD3MkqEcXmvX_hSs14hjDUdukuVMW7vb74gAxyPu0KekweuaSzIBABaicoWUMc';
const permOk=()=>('Notification' in window)&&Notification.permission=='granted',canAsk=()=>('Notification' in window)&&Notification.permission=='default';
async function activarAvisos(role,num){
 try{
  if(!('Notification' in window)||!('serviceWorker' in navigator)){toast('Este navegador no permite avisos');return false}
  if(await Notification.requestPermission()!='granted'){toast('No diste permiso para los avisos');return false}
  const reg=await navigator.serviceWorker.ready;
  const tk=await getToken(getMessaging(app),{vapidKey:VAPID,serviceWorkerRegistration:reg});
  await setDoc(doc(db,'tokens',tk),{role,num:num||'',ts:serverTimestamp()});
  toast('Avisos activados ✅');return true
 }catch(e){console.error(e);toast('No se pudieron activar los avisos');return false}
}
let firstO=true;
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);o.start();o.stop(c.currentTime+.6)}catch(e){}toast('🔔 Pedido nuevo')}
const $=s=>document.querySelector(s),ADMIN=location.hash=='#admin';
addEventListener('hashchange',()=>location.reload());
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICO={cart:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.7"/><circle cx="18" cy="20" r="1.7"/><path d="M2 3.5h3l2.6 12a1 1 0 0 0 1 .8h8.8a1 1 0 0 0 1-.8L20 7.5H6"/></svg>'.replace('width="26" height="26"','width="22" height="22"'),trash:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>'.replace('M2 3.5','M2 3.5'),box:'<svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="#bbb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>'};
const pic=(p,big)=>p.img?`<img src="${p.img}" alt="" onerror="this.parentNode.classList.add('noimg')">`:ICO.box;
let P=[],C=[],O=[];
/* ================= CLIENTE ================= */
let cart={},cat='Todas',q='',view='home';
const pr=id=>P.find(p=>p.id==id),total=()=>Object.values(cart).reduce((a,b)=>a+b,0);
let lastSaved='';
const CK=()=>'cart_'+(CL?CL.id:'');
function saveCart(){if(!CL)return;const s=JSON.stringify(cart);if(s===lastSaved)return;lastSaved=s;try{if(total())localStorage.setItem(CK(),JSON.stringify({c:cart,t:Date.now()}));else localStorage.removeItem(CK())}catch(e){}}
function loadCart(){try{const d=JSON.parse(localStorage.getItem(CK())||'null');if(d&&d.c&&Date.now()-d.t<12*36e5){localStorage.setItem(CK(),JSON.stringify({c:d.c,t:Date.now()}));return d.c}localStorage.removeItem(CK())}catch(e){}return {}}
function setQty(id,v){let n=parseInt(v,10);if(!n||n<1)n=1;if(n>9999)n=9999;cart[id]=n;render()}
function go(v){
 if(v==view){if(v=='home'&&cat!='Todas'){if(history.state&&history.state.n=='f')history.back();else{cat='Todas';render()}}return}
 if(v=='home'){if(history.state&&history.state.n=='v')history.back();else{view='home';render()}return}
 if(view=='home')history.pushState({n:'v'},'');
 view=v;render();
}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));
 saveCart();
 const bd=$('#bd');bd.style.display=total()?'block':'none';bd.textContent=total();
 const a=$('#app');a.classList.toggle('nr',view!='home');const cats=['Todas',...new Set(P.map(p=>p.c).filter(Boolean))];
 if(view=='home'){
  const l=P.filter(p=>(cat=='Todas'||p.c==cat)&&p.n.toLowerCase().includes(q.toLowerCase()));
  a.innerHTML=(cat!='Todas'?'<h2>'+esc(cat)+'</h2>':'')+(l.length?'<div class="grid">'+l.map(p=>`<div class="card" data-id="${p.id}"><div class="ph">${pic(p)}</div><div class="cap"><div class="nm">${esc(p.n)}</div><button class="add ${cart[p.id]?'on':''}">${ICO.cart}<span>${cart[p.id]?cart[p.id]:'+'}</span></button></div></div>`).join('')+'</div>':'<p class="mut">No hay productos para mostrar.</p>');
 }else if(view=='cats'){
  a.innerHTML='<h2>Categorías</h2>'+cats.map(c=>`<button class="chip ${c==cat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
 }else if(view=='ped'){
  const fe=o=>o.ts?o.ts.toDate().toLocaleDateString('es-AR')+' '+o.ts.toDate().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'Enviando…';
  a.innerHTML='<h2>Mis pedidos</h2>'+(MO.length?MO.map(o=>`<div class="ord"><div class="row"><b>${fe(o)}</b><span class="mut">${esc(o.estado)}</span></div><ul>${o.items.map(i=>`<li>${esc(i.q)} × ${esc(i.n)}</li>`).join('')}</ul>${o.factura?`<button class="lnk" style="padding:4px 0" data-fac="${o.id}">📄 Descargar factura</button>`:''}</div>`).join(''):'<p class="mut">Todavía no hiciste pedidos.</p>');
 }else{
  const ids=Object.keys(cart).filter(pr);
  a.innerHTML='<h2>Mi carrito</h2>'+(ids.length?ids.map(id=>{const p=pr(id);return `<div class="item"><div class="th">${pic(p)}</div><div class="nm">${esc(p.n)}</div><div class="q"><button data-m="${id}">–</button><input class="qi" type="number" inputmode="numeric" min="1" max="9999" value="${cart[id]}" data-qi="${id}"><button data-p="${id}">+</button></div><button class="lnk" style="color:#d33;padding:6px" data-r="${id}">${ICO.trash}</button></div>`}).join('')+'<button class="btn" id="send">Enviar</button>':'<p class="mut">Todavía no agregaste productos.</p>');
 }
}
function detail(id){
 const p=pr(id);let n=cart[id]||1;
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<button class="bk">← Volver</button><div class="big">${pic(p)}</div><div class="box"><div style="font-size:18px;font-weight:600">${esc(p.n)}</div><p class="mut">${esc(p.d)}</p><div class="row"><span>Cantidad</span><div class="q"><button id="mn">–</button><input id="nn" class="qi" type="number" inputmode="numeric" min="1" max="9999" value="${n}"><button id="pl">+</button></div></div><button class="btn" id="ad">${cart[id]?'Actualizar cantidad':'Agregar al carrito'}</button>${cart[id]?'<button class="btn r" id="rm">Quitar del carrito</button>':''}</div>`;
 document.body.appendChild(o);history.pushState({n:'ov'},'');
 o.querySelector('.bk').onclick=()=>history.back();
 const qi=o.querySelector('#nn'),gq=()=>{let v=parseInt(qi.value,10);if(!v||v<1)v=1;if(v>9999)v=9999;return v};
 qi.onfocus=()=>qi.select();
 o.querySelector('#mn').onclick=()=>{qi.value=Math.max(1,gq()-1)};
 o.querySelector('#pl').onclick=()=>{qi.value=Math.min(9999,gq()+1)};
 if(o.querySelector('#rm'))o.querySelector('#rm').onclick=()=>{delete cart[id];history.back();render();toast('Producto quitado')};
 o.querySelector('#ad').onclick=()=>{cart[id]=gq();history.back();render();toast('Carrito actualizado')};
}
function form(){
 const ids=Object.keys(cart).filter(pr),o=document.createElement('div');o.className='ov';
 o.innerHTML=`<button class="bk">← Volver</button><div class="box"><div style="font-size:18px;font-weight:600">Confirmar pedido</div><p class="mut">Cliente ${esc(CL.id)} · ${esc(CL.nombre)}</p>${ids.map(id=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--ln)"><span>${esc(pr(id).n)}</span><b>× ${cart[id]}</b></div>`).join('')}<div class="err" id="er"></div><button class="btn" id="ok">Enviar pedido</button></div>`;
 document.body.appendChild(o);history.pushState({n:'ov'},'');
 o.querySelector('.bk').onclick=()=>history.back();
 o.querySelector('#ok').onclick=async()=>{
  const items=ids.map(id=>({cod:pr(id).cod||'',n:pr(id).n,q:cart[id]}));
  o.querySelector('#ok').disabled=true;
  try{await addDoc(collection(db,'orders'),{num:CL.id,nombre:CL.nombre,apellido:'',loc:'',items,estado:'Nuevo',ts:serverTimestamp()})}
  catch(e){o.querySelector('#ok').disabled=false;o.querySelector('#er').textContent='No se pudo enviar. Revisá tu conexión e intentá de nuevo.';return}
  cart={};saveCart();
  o.innerHTML='<div class="box" style="margin-top:60px;text-align:center"><div style="font-size:60px">✅</div><div style="font-size:20px;font-weight:600">¡Pedido enviado!</div><p class="mut" id="gr"></p><button class="btn" id="fin">Volver al inicio</button></div>';
  o.querySelector('#gr').textContent='Gracias '+CL.nombre+', recibimos tu pedido.';
  o.querySelector('#fin').onclick=()=>{view='home';render();scrollTo(0,0);history.go(-2)};
 };
}
let CL=null,unsubs=[],MO=[],msg='';
function foot(){$('#ft').innerHTML=(CL?`<span style="font-size:13px;color:var(--mut)">Cliente ${esc(CL.id)} · </span><a id="so" style="font-size:13px;color:var(--mut);cursor:pointer">Cerrar sesión</a> · ${canAsk()?'<a id="av" style="font-size:13px;color:var(--mut);cursor:pointer">🔔 Activar avisos</a> · ':''}`:'')+'<a href="#admin" style="font-size:13px;color:var(--mut);text-decoration:none">Acceso administrador</a>'}
function loginCli(){
 $('#hd').style.display='none';$('#nv').style.display='none';$('#app').classList.add('nr');
 $('#app').innerHTML=`<div class="box" style="margin-top:40px"><div style="font-size:18px;font-weight:600">Ingresá a tu cuenta</div><label>Número de cliente</label><input class="f" id="un" inputmode="numeric" autocomplete="username"><label>Contraseña</label>${pwf('up2','current-password')}<div class="err" id="er"></div><button class="btn" id="go">Ingresar</button></div>`;
 $('#er').textContent=msg;msg='';

  try{await signInWithEmailAndPassword(auth,n+DOM,p)}catch(e){$('#er').textContent='Número o contraseña incorrectos.'}};
}
async function descargar(id){
 toast('Preparando descarga…');
 try{const d=await getDoc(doc(db,'invoices',id));if(!d.exists())throw 0;const x=d.data(),b=await (await fetch(x.data)).blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=x.nombre||'factura';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
 catch(e){toast('No se pudo descargar la factura')}
}
function startClient(){
 $('#app').onclick=e=>{
  const t=e.target,c=t.closest('.card');if(c){detail(c.dataset.id);return}
  const ct=t.closest('[data-cat]');if(ct){cat=ct.dataset.cat;if(cat!='Todas'&&history.state&&history.state.n=='v'){history.replaceState({n:'f'},'');view='home';render()}else{go('home');render()}scrollTo(0,0);return}
  if(t.dataset.p){cart[t.dataset.p]++;render()}
  else if(t.dataset.m){if(--cart[t.dataset.m]<=0)delete cart[t.dataset.m];render()}
  else if(t.dataset.r){delete cart[t.dataset.r];render()}
  else if(t.dataset.ped){view='ped';render();scrollTo(0,0)}
  else if(t.dataset.back){view='cart';render()}
  else if(t.dataset.fac)descargar(t.dataset.fac)
  else if(t.id=='send')form();
 };
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{go(b.dataset.v);scrollTo(0,0)});
 $('#s').oninput=e=>{q=e.target.value;go('home');render()};
 $('#up').onclick=()=>scrollTo({top:0,behavior:'smooth'});
 history.replaceState(null,'');
 addEventListener('popstate',()=>{const l=[...document.querySelectorAll('.ov')];if(l.length){l.pop().remove();return}if(view!='home'){view='home';render();scrollTo(0,0);return}if(cat!='Todas'){cat='Todas';render();scrollTo(0,0)}});
 $('#app').onchange=e=>{const t=e.target;if(t.dataset.qi)setQty(t.dataset.qi,t.value)};
 $('#app').onfocusin=e=>{if(e.target.dataset&&e.target.dataset.qi)e.target.select()};
 $('#ft').onclick=e=>{if(e.target.id=='so')signOut(auth);if(e.target.id=='av')activarAvisos('cliente',CL.id).then(foot)};
 addEventListener('scroll',()=>$('#up').style.display=scrollY>400?'block':'none');
 onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];
  if(!isCust(u)){CL=null;cart={};view='home';cat='Todas';loginCli();foot();return}
  try{const d=await getDoc(doc(db,'clients',u.email.split('@')[0]));if(!d.exists())throw 0;CL={id:d.id,...d.data()}}
  catch(e){msg='Tu usuario todavía no está habilitado. Consultá con el administrador.';await signOut(auth);return}
  cart=loadCart();lastSaved=JSON.stringify(cart);
  $('#hd').style.display='';$('#nv').style.display='';
  unsubs.push(onSnapshot(collection(db,'products'),s=>{P=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.n.localeCompare(b.n));Object.keys(cart).forEach(k=>{if(!pr(k))delete cart[k]});render()},()=>signOut(auth)));
  unsubs.push(onSnapshot(query(collection(db,'orders'),where('num','==',CL.id)),s=>{MO=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts?b.ts.seconds:9e9)-(a.ts?a.ts.seconds:9e9));if(view=='ped')render()}));
  render();foot();if(permOk())activarAvisos('cliente',CL.id);
 });
}
/* ================= ADMINISTRADOR ================= */
let tab='p',edit=null,sel=new Set(),unsub=[];
const rs=(f,m=600,ql=.7)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',ql))};i.src=URL.createObjectURL(f)});
const nomCli=n=>(C.find(c=>c.id==n)||{}).nombre;
function login(){
 $('#app').innerHTML=`<div class="box" style="margin-top:40px"><div style="font-size:18px;font-weight:600">Administrador</div><label>Correo</label><input class="f" id="em" type="email"><label>Contraseña</label>${pwf('pw','current-password')}<div class="err" id="er"></div><button class="btn" id="go">Ingresar</button><div style="text-align:center;margin-top:8px"><a class="lnk" href="#" style="text-decoration:none">← Volver a la tienda</a></div></div>`;
 $('#go').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(e){$('#er').textContent='Correo o contraseña incorrectos.'}};
}
function shell(){
 $('#app').innerHTML=`<div class="atop"><b>Administrador</b><span><a class="lnk" href="#" style="text-decoration:none;padding:14px 6px">Ver tienda</a>${canAsk()?'<button class="lnk" id="av" style="padding:14px 6px">🔔 Avisos</button>':''}<button class="lnk" id="lo">Salir</button></span></div><div class="tabs">${[['p','Productos'],['c','Clientes'],['o','Pedidos']].map(([k,l])=>`<button data-t="${k}" class="${k==tab?'on':''}">${l}</button>`).join('')}</div><div id="frm"></div><div id="lst"></div>`;
 $('#lo').onclick=()=>signOut(auth);
 if($('#av'))$('#av').onclick=async()=>{if(await activarAvisos('admin'))$('#av').remove()};
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;edit=null;shell()});
 frm();list();
}
function frm(){
 const f=$('#frm');
 if(tab=='p'){
  const p=P.find(x=>x.id==edit)||{};
  f.innerHTML=`<div class="box"><b>${edit?'Editar producto':'Nuevo producto'}</b><label>Foto</label><input type="file" id="fo" accept="image/*"><label>Código</label><input class="f" id="pc" value="${esc(p.cod)}"><label>Descripción</label><input class="f" id="pn" value="${esc(p.n)}"><label>Categoría</label><input class="f" id="pg" value="${esc(p.c)}"><label>Detalle (opcional)</label><input class="f" id="pd" value="${esc(p.d)}"><div class="err" id="er"></div><button class="btn" id="sv">Guardar</button>${edit?'<button class="lnk" id="cx">Cancelar</button>':''}</div>`;
  if(edit)$('#cx').onclick=()=>{edit=null;frm()};
  $('#sv').onclick=async()=>{
   const d={cod:$('#pc').value.trim(),n:$('#pn').value.trim(),c:$('#pg').value.trim(),d:$('#pd').value.trim()};
   if(!d.cod||!d.n){$('#er').textContent='Código y descripción son obligatorios.';return}
   $('#sv').disabled=true;
   try{const fl=$('#fo').files[0];if(fl)d.img=await rs(fl);
    await setDoc(edit?doc(db,'products',edit):doc(collection(db,'products')),d,{merge:true});edit=null;frm();toast('Producto guardado')}
   catch(e){$('#sv').disabled=false;$('#er').textContent='No se pudo guardar.'}
  };
 }else if(tab=='c'){
  const c=C.find(x=>x.id==edit)||{};
  f.innerHTML=`<div class="box"><b>${edit?'Editar cliente':'Nuevo cliente'}</b><label>Número de cliente</label><input class="f" id="cn" value="${esc(c.id)}" ${edit?'disabled':''}><label>Nombre</label><input class="f" id="cm" value="${esc(c.nombre)}"><label>Dirección de entrega</label><input class="f" id="cd" value="${esc(c.dir)}"><label>Contraseña del cliente (mín. 6; dejala vacía si ya tiene usuario)</label>${pwf('cp','new-password')}<div class="err" id="er"></div><button class="btn" id="sv">Guardar</button>${edit?'<button class="lnk" id="cx">Cancelar</button>':''}</div>`;
  if(edit)$('#cx').onclick=()=>{edit=null;frm()};
  $('#sv').onclick=async()=>{
   const n=$('#cn').value.trim().replace(/\//g,''),nm=$('#cm').value.trim();
   if(!n||!nm){$('#er').textContent='Número y nombre son obligatorios.';return}
   const pw=$('#cp').value;
   if(!edit&&pw.length<6){$('#er').textContent='Para un cliente nuevo cargá una contraseña de al menos 6 caracteres.';return}
   try{let av='';
    if(pw){if(pw.length<6){$('#er').textContent='La contraseña debe tener al menos 6 caracteres.';return}
     try{await createUserWithEmailAndPassword(secAuth,n.toLowerCase()+DOM,pw);await signOut(secAuth)}
     catch(e){if(e.code=='auth/email-already-in-use')av=' (ese usuario ya existía: la clave no se cambió)';else{$('#er').textContent='No se pudo crear el usuario ('+(e.code||'error')+').';return}}}
    await setDoc(doc(db,'clients',n),{nombre:nm,dir:$('#cd').value.trim()});edit=null;frm();toast('Cliente guardado'+av)}
   catch(e){$('#er').textContent='No se pudo guardar.'}
  };
 }else f.innerHTML='';
}
function list(){
 const l=$('#lst');if(!l)return;
 if(tab=='p'){
  l.innerHTML=P.map(p=>`<div class="item"><div class="th">${pic(p)}</div><div class="nm"><b>${esc(p.cod)}</b> · ${esc(p.n)}<div class="sm">${esc(p.c)}</div></div><button class="lnk" data-e="${p.id}">Editar</button><button class="lnk" style="color:#d33" data-x="${p.id}">✕</button></div>`).join('')||'<p class="mut">Todavía no cargaste productos.</p>';
 }else if(tab=='c'){
  l.innerHTML=C.map(c=>`<div class="item"><div class="nm"><b>${esc(c.id)}</b> · ${esc(c.nombre)}<div class="sm">${esc(c.dir)}</div></div><button class="lnk" data-e="${c.id}">Editar</button><button class="lnk" style="color:#d33" data-x="${c.id}">✕</button></div>`).join('')||'<p class="mut">Todavía no cargaste clientes.</p>';
 }else{
  l.innerHTML=(O.length?`<div class="row" style="gap:6px"><button class="btn g" id="xl" style="margin:0">Excel (${sel.size})</button><button class="btn" id="pd" style="margin:0">PDF (${sel.size})</button><button class="btn r" id="dl" style="margin:0">Eliminar (${sel.size})</button></div><button class="lnk" id="sa">Tildar todos / ninguno</button>`:'<p class="mut">Todavía no hay pedidos.</p>')+O.map(o=>{const c=C.find(x=>x.id==o.num);return `<div class="ord"><div class="row"><label style="margin:0;display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px"><input type="checkbox" data-s="${o.id}" ${sel.has(o.id)?'checked':''}><b>${esc(o.num)}</b> · ${esc(c?c.nombre:'Cliente no registrado')}</label><select data-st="${o.id}">${['Nuevo','Preparando','Enviado','Entregado'].map(s=>`<option ${s==o.estado?'selected':''}>${s}</option>`).join('')}</select></div><div class="sm">${esc(o.nombre)} ${esc(o.apellido)} · ${esc(o.loc)}${c&&c.dir?' · '+esc(c.dir):''}</div><div class="sm">${o.ts?o.ts.toDate().toLocaleString('es-AR'):''}</div>${o.factura?'<div class="sm">📄 Factura cargada</div>':''}<ul>${o.items.map(i=>`<li>${esc(i.q)} × ${esc(i.n)} (${esc(i.cod)})</li>`).join('')}</ul><button class="lnk" style="padding:4px 0" data-ver="${o.id}">Ver pedido completo</button></div>`}).join('');
 }
}
function filas(sl){const by={};sl.forEach(o=>(by[o.num]=by[o.num]||[]).push(o));const r=[];Object.keys(by).forEach((n,i)=>{if(i)r.push([]);const nm=nomCli(n)||'';by[n].forEach(o=>o.items.forEach(it=>r.push([n,nm,it.n,it.cod,it.q])))});return r}
function exportar(tipo,lista){
 const sl=lista||O.filter(o=>sel.has(o.id));if(!sl.length){toast('Tildá al menos un pedido');return}
 const rows=filas(sl),st=new Date().toLocaleString('sv-SE').replace(/[: ]/g,'-').slice(0,16);
 if(tipo=='x'){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Pedidos');XLSX.writeFile(wb,'pedidos-'+st+'.xlsx');toast('Exportados '+sl.length+' pedido(s)')}
 else{const d=new window.jspdf.jsPDF({orientation:'landscape'});d.autoTable({head:[['Cliente','Nombre','Descripción','Código','Cantidad']],body:rows.map(r=>r.length?r:['','','','','']),styles:{fontSize:9}});toast('Exportados '+sl.length+' pedido(s)');d.save('pedidos-'+st+'.pdf')}
}
async function borrar(){
 const sl=O.filter(o=>sel.has(o.id));if(!sl.length){toast('Tildá al menos un pedido');return}
 if(!confirm('¿Eliminar '+sl.length+' pedido(s)? No se puede deshacer.'))return;
 try{for(const o of sl){await deleteDoc(doc(db,'orders',o.id));sel.delete(o.id)}toast('Pedidos eliminados')}catch(e){toast('No se pudo eliminar')}
}
function ver(id){
 const o=O.find(x=>x.id==id);if(!o)return;const c=C.find(x=>x.id==o.num)||{};
 const v=document.createElement('div');v.className='ov';
 v.innerHTML=`<button class="bk">← Volver</button><div class="box"><div style="font-size:18px;font-weight:600">Cliente ${esc(o.num)}</div><div>${esc(c.nombre||'Cliente no registrado')}</div><div class="sm">Dirección: ${esc(c.dir||'—')}</div><div class="sm">Pidió: ${esc(o.nombre)} ${esc(o.apellido)} · ${esc(o.loc)}</div><div class="sm">${o.ts?o.ts.toDate().toLocaleString('es-AR'):''} · ${esc(o.estado)}</div></div><div class="box">${o.items.map(i=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--ln)"><span>${esc(i.n)}<div class="sm">Cód. ${esc(i.cod)}</div></span><b>× ${esc(i.q)}</b></div>`).join('')}</div><div class="box"><b>Factura</b><div class="sm">${o.factura?'Cargada: '+esc(o.facturaNombre):'Todavía no cargaste una factura.'}</div><input type="file" id="ff" accept="application/pdf,image/*" style="margin-top:8px;max-width:100%"><button class="btn" id="fu">${o.factura?'Reemplazar factura':'Subir factura'}</button>${o.factura?'<button class="btn r" id="fq">Quitar factura</button>':''}<div class="err" id="fe"></div></div><div class="box"><button class="btn g" id="vx">Excel de este pedido</button><button class="btn" id="vp">PDF de este pedido</button><button class="btn r" id="vd">Eliminar pedido</button></div>`;
 document.body.appendChild(v);
 v.querySelector('.bk').onclick=()=>v.remove();
 v.querySelector('#fu').onclick=async()=>{
  const f=v.querySelector('#ff').files[0],er=v.querySelector('#fe');if(!f){er.textContent='Elegí un archivo primero.';return}
  er.textContent='Subiendo '+f.name+' ('+Math.round(f.size/1024)+' KB)…';
  try{
   const data=f.type.startsWith('image/')?await rs(f,1400,.7):await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(f)});
   if(data.length>900000){er.textContent='El archivo es muy pesado (máximo aprox. 650 KB). Probá con un PDF o una foto más liviana.';return}
   await setDoc(doc(db,'invoices',o.id),{num:o.num,nombre:f.name,data,ts:serverTimestamp()});
   await updateDoc(doc(db,'orders',o.id),{factura:true,facturaNombre:f.name});
   v.remove();toast('Factura cargada');
  }catch(e){console.error(e);er.textContent=e.code=='permission-denied'?'Firebase no permitió guardar la factura. Revisá que las reglas estén publicadas y que hayas entrado con tu correo de administrador.':'No se pudo subir la factura ('+(e.code||e.message||'error')+').'}
 };
 const fq=v.querySelector('#fq');if(fq)fq.onclick=async()=>{if(!confirm('¿Quitar la factura?'))return;try{await deleteDoc(doc(db,'invoices',o.id));await updateDoc(doc(db,'orders',o.id),{factura:false,facturaNombre:''});v.remove();toast('Factura quitada')}catch(e){toast('No se pudo quitar')}};
 v.querySelector('#vx').onclick=()=>exportar('x',[o]);
 v.querySelector('#vp').onclick=()=>exportar('p',[o]);
 v.querySelector('#vd').onclick=async()=>{if(!confirm('¿Eliminar este pedido?'))return;try{await deleteDoc(doc(db,'orders',o.id));sel.delete(o.id);v.remove();toast('Pedido eliminado')}catch(e){toast('No se pudo eliminar')}};
}
function startAdmin(){
 $('#app').classList.add('nr');$('#hd').style.display='none';$('#ft').style.display='none';$('#nv').style.display='none';
 $('#app').onclick=async e=>{
  const t=e.target;
  if(t.dataset.e){edit=t.dataset.e;frm();scrollTo(0,0)}
  else if(t.dataset.x&&confirm('¿Eliminar?')){await deleteDoc(doc(db,tab=='p'?'products':'clients',t.dataset.x))}
  else if(t.dataset.s){t.checked?sel.add(t.dataset.s):sel.delete(t.dataset.s);list()}
  else if(t.id=='sa'){sel.size==O.length?sel.clear():O.forEach(o=>sel.add(o.id));list()}
  else if(t.id=='xl')exportar('x');else if(t.id=='pd')exportar('p');else if(t.id=='dl')borrar();else if(t.dataset.ver)ver(t.dataset.ver);
 };
 $('#app').onchange=async e=>{const t=e.target;if(t.dataset.st)await updateDoc(doc(db,'orders',t.dataset.st),{estado:t.value})};
 onAuthStateChanged(auth,u=>{
  unsub.forEach(f=>f());unsub=[];firstO=true;
  if(!u||isCust(u)){if(u)signOut(auth);login();return}
  shell();if(permOk())activarAvisos('admin');
  unsub.push(onSnapshot(collection(db,'products'),s=>{P=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.n.localeCompare(b.n));list()}));
  unsub.push(onSnapshot(collection(db,'clients'),s=>{C=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));list()}));
  unsub.push(onSnapshot(collection(db,'orders'),s=>{if(!firstO&&s.docChanges().some(c=>c.type=='added'))beep();firstO=false;O=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts?b.ts.seconds:9e9)-(a.ts?a.ts.seconds:9e9));list()}));
 });
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
ADMIN?startAdmin():startClient();
</script></body></html>
